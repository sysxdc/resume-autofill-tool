<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>e2e：单输入框起止时间 / 不把日期写进非日期范围框</title>
<style>body{font:14px/1.6 sans-serif;padding:16px} .row{margin:6px 0} label{display:inline-block;width:120px}</style></head>
<body>
<div class="sec"><h3>教育经历</h3>
  <div class="row"><label for="edu1">起止时间</label><input id="edu1" placeholder="YYYY.MM - YYYY.MM"></div>
  <div class="row"><label for="sch1">学校名称</label><input id="sch1"></div>
</div>
<div class="sec"><h3>教育经历</h3>
  <div class="row"><label for="edu2">起止时间</label><input id="edu2" placeholder="YYYY.MM - YYYY.MM"></div>
  <div class="row"><label for="sch2">学校名称</label><input id="sch2"></div>
</div>
<div class="sec"><h3>工作经历</h3>
  <div class="row"><label for="wk">任职期间</label><input id="wk" placeholder="开始 ~ 结束"></div>
  <div class="row"><label for="pay">期望薪资范围</label><input id="pay" placeholder="例：10k - 15k"></div>
</div>
</body>
</html>
