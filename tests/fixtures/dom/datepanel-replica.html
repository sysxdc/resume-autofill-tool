<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>多表格日期面板复刻（年/月/日 + 确定）</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; padding: 20px; background: #f7f9fb; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
  input[readonly] { width: 280px; padding: 8px; border: 1px solid #d9dee5; border-radius: 6px; background: #f2f4f7; }
  #dpPanel { display: none; position: absolute; z-index: 20; background: #fff; border: 1px solid #e3e7ee;
             box-shadow: 0 6px 20px rgba(0,0,0,.12); border-radius: 8px; padding: 8px; }
  #dpPanel table { border-collapse: collapse; display: inline-block; vertical-align: top; height: 190px; overflow-y: auto; }
  #dpPanel table + table { margin-left: 6px; }
  #dpPanel td { padding: 4px 10px; font-size: 13px; cursor: pointer; text-align: center; border-radius: 4px; }
  #dpPanel td:hover { background: #eef4ff; }
  #dpPanel td.on { background: #1e9fff; color: #fff; }
  #dpPanel .btns { text-align: right; padding-top: 6px; }
  #dpPanel button { padding: 5px 12px; border: 1px solid #1e9fff; background: #1e9fff; color: #fff; border-radius: 4px; cursor: pointer; }
  #dpPanel button.cancel { background: #fff; color: #666; border-color: #d9dee5; }
</style>
</head>
<body>

<div class="field"><label>出生日期*</label>
  <input id="birthday" type="text" readonly placeholder="出生日期" />
</div>
<div class="field"><label>应聘职位*</label>
  <input type="text" name="JOB_OBJECTIVE" placeholder="应聘职位" />
</div>

<div id="dpPanel">
  <table id="dpYears"><tbody></tbody></table>
  <table id="dpMonths"><tbody></tbody></table>
  <table id="dpDays"><tbody></tbody></table>
  <div class="btns">
    <button type="button" class="cancel" id="dpCancel">取消</button>
    <button type="button" id="dpOk">确定</button>
  </div>
</div>

<script>
  var input = document.getElementById('birthday');
  var panel = document.getElementById('dpPanel');
  var picked = { y: null, m: null, d: null };

  function fillTable(tbl, from, to, key, pad) {
    var tb = tbl.querySelector('tbody');
    tb.innerHTML = '';
    for (var v = from; v <= to; v++) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.textContent = pad && v < 10 ? '0' + v : String(v);
      td.setAttribute('data-v', String(v));
      td.setAttribute('data-k', key);
      tr.appendChild(td);
      tb.appendChild(tr);
    }
  }
  fillTable(document.getElementById('dpYears'), 1990, 2005, 'y', false);
  fillTable(document.getElementById('dpMonths'), 1, 12, 'm', false);
  fillTable(document.getElementById('dpDays'), 1, 31, 'd', true);

  input.addEventListener('click', function () {
    var r = input.getBoundingClientRect();
    panel.style.left = r.left + 'px';
    panel.style.top = (r.bottom + window.scrollY + 4) + 'px';
    panel.style.display = 'block';
  });

  panel.addEventListener('click', function (e) {
    var td = e.target.closest('td');
    if (td) {
      picked[td.getAttribute('data-k')] = td.getAttribute('data-v');
      td.parentElement.parentElement.querySelectorAll('td.on').forEach(function (x) { x.classList.remove('on'); });
      td.classList.add('on');
      return;
    }
    if (e.target.id === 'dpOk') {
      if (picked.y && picked.m && picked.d) {
        input.value = picked.y + '-' + ('0' + picked.m).slice(-2) + '-' + ('0' + picked.d).slice(-2);
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }
      panel.style.display = 'none';
    }
    if (e.target.id === 'dpCancel') panel.style.display = 'none';
  });
  window.__submitted = 0;
</script>
</body>
</html>
