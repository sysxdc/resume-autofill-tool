<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>校招填写回归</title>
<style>body{font:16px sans-serif}label{display:block;margin:8px}input{height:28px}.phoenix-select{width:160px;height:32px}.ant-select{width:180px;height:32px;border:1px solid}</style>
<div class="form-cell" id="education"><div class="tit-wrap"><div class="tit"><p>教育经历</p></div></div><div class="form-cell-right"><div class="form-cell-inner"><label>学校<input id="school"></label><label>GPA<input id="gpa" type="number" step="0.1"></label><label>辅修专业<input id="minor"></label></div><button id="add" onclick="window.addCount++">添加教育经历</button></div></div>
<fieldset><legend>项目经历</legend><label>职务<input id="role" placeholder="请输入职务名称"></label></fieldset>
<fieldset><legend>家庭情况</legend><label>姓名<input id="family" autocomplete="name"></label><label>联系电话<input id="familyPhone" autocomplete="tel"></label></fieldset>
<label>证件号码（用于实名认证）<input id="form_item_certificateNo"></label>
<label>Github 星级<input id="stars" type="number"></label>
<div class="ant-form-item"><div class="ant-form-item-label"><label class="ant-form-item-required">成绩排名</label></div><div class="ant-select"><div class="ant-select-selection"><span>请选择</span><input type="search"></div></div></div>
<div class="phoenix-select" id="phoenix"><span class="phoenix-select__calcEle">本科</span><div class="phoenix-select__placeHolder">本科</div><span class="phoenix-select__tipEle">本科</span></div>
<div class="ant-picker-dropdown"><label>学校<input id="popup"></label></div>
<script>
window.addCount=0;
window.testProfile={name:'测试人',phone:'13800000000',idNumber:'TEST-ID',school:'测试大学',gpa:'3.0/4.5',github:'https://example.test/dev',eduList:[{school:'测试大学',gpa:'3.0/4.5'}],projectList:[{name:'测试项目',role:'负责人'}]};
globalThis.chrome={storage:{local:{get:(k,cb)=>cb({profile:window.testProfile})}},runtime:{onMessage:{addListener:()=>{}}}};
(async()=>{const m=await (await fetch('../../../manifest.json')).json();for(const src of ['content/page-bridge.js',...m.content_scripts[0].js.filter(x=>x!=='content/panel.js')])await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='../../../'+src;s.onload=resolve;s.onerror=reject;document.head.append(s)});window.fixtureReady=true;})();
</script></html>
