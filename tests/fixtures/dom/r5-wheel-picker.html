<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8" /><title>R5 滚轮式日期选择（Wheel Picker）</title>
<style>
 body{font-family:system-ui;padding:20px}
 input[readonly]{width:280px;padding:8px;border:1px solid #ccc;border-radius:6px;background:#f4f6f8}
 #wheel{display:none;position:absolute;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:8px}
 .cols{display:flex;gap:0}
 .col{width:90px;height:170px;overflow-y:auto;scroll-snap-type:y mandatory;border-right:1px solid #f0f0f0}
 .col:last-child{border-right:0}
 .col li{list-style:none;height:34px;line-height:34px;text-align:center;font-size:14px;color:#666;cursor:pointer;scroll-snap-align:center}
 .col li.on{color:#2f6fed;font-weight:600}
 .foot{display:flex;justify-content:flex-end;gap:8px;padding-top:8px}
 .foot button{padding:5px 12px;border:1px solid #ddd;background:#fff;border-radius:4px;cursor:pointer}
 .foot button.primary{background:#2f6fed;color:#fff;border-color:#2f6fed}
</style></head>
<body>
<p><label>出生日期*<br /><input id="bd" readonly placeholder="请选择" /></label></p>
<p>应聘职位* <input name="JOB_OBJECTIVE" /></p>

<div id="wheel">
  <div class="cols">
    <ul class="col" id="cy" data-k="y"></ul>
    <ul class="col" id="cm" data-k="m"></ul>
    <ul class="col" id="cd" data-k="d"></ul>
  </div>
  <div class="foot">
    <button type="button" id="cancel">取消</button>
    <button type="button" id="ok" class="primary">确定</button>
  </div>
</div>

<script>
var input=document.getElementById('bd'), wheel=document.getElementById('wheel');
var picked={y:null,m:null,d:null};
function build(id,k,from,to){
  var ul=document.getElementById(id);
  for(var v=from;v<=to;v++){
    var li=document.createElement('li');
    li.textContent=String(v); li.setAttribute('data-k',k); li.setAttribute('data-v',String(v));
    ul.appendChild(li);
  }
}
build('cy','y',1970,2010); build('cm','m',1,12); build('cd','d',1,31);
input.addEventListener('click',function(){var r=input.getBoundingClientRect();
  wheel.style.left=r.left+'px'; wheel.style.top=(r.bottom+scrollY+4)+'px'; wheel.style.display='block';});
wheel.addEventListener('click',function(e){
  var li=e.target.closest('li'); if(!li)return;
  picked[li.getAttribute('data-k')]=li.getAttribute('data-v');
  li.parentElement.querySelectorAll('li.on').forEach(function(x){x.classList.remove('on');});
  li.classList.add('on');
});
document.getElementById('ok').addEventListener('click',function(){
  if(picked.y&&picked.m&&picked.d){
    input.value=picked.y+'-'+('0'+picked.m).slice(-2)+'-'+('0'+picked.d).slice(-2);
    input.dispatchEvent(new Event('input',{bubbles:true}));
    input.dispatchEvent(new Event('change',{bubbles:true}));
  }
  wheel.style.display='none';
});
document.getElementById('cancel').addEventListener('click',function(){wheel.style.display='none';});
</script>
</body></html>
