<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>字段核验与已有内容保护</title>
<style>label{display:block;margin:10px}input{height:25px}</style>
<label>姓名<input id="name" value="用户确认的名字"></label>
<label>手机号码<input id="phone"></label>
<label>电子邮箱<input id="email"></label>
<label>个人网站<input id="website"></label>
<label>GPA<input id="gpa" type="number" step="0.1" min="0" max="4.5"></label>
<label>ZZZ甲<input id="existing" value="保留内容"></label><label>ZZZ乙<input id="async-value"></label>
<label>ZZZ丙<input id="constrained" type="number" min="0" max="4.5" step="0.1"></label>
<label>ZZZ丁<input id="required-controlled" required></label>
<script>
document.getElementById('phone').addEventListener('input', e => { e.target.value = e.target.value.replace(/(\d{3})(\d{4})(\d{4})/, '$1 $2 $3'); });
document.getElementById('email').addEventListener('input', e => { e.target.value = e.target.value.replace('first.last', 'firstlast'); });
document.getElementById('website').addEventListener('input', e => { e.target.value = e.target.value.replace('/a-b', '/ab'); });
document.getElementById('async-value').addEventListener('input', e => { Promise.resolve().then(() => { e.target.value = '页面异步回填'; }); });
(() => {
  const input = document.getElementById('required-controlled');
  let state = '';
  input.addEventListener('keydown', e => { if (e.key.length === 1) state += e.key; });
  input.addEventListener('input', () => { if (!input.value) state = ''; Promise.resolve().then(() => { input.value = state; }); });
})();
</script></html>
