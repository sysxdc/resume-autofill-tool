<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简历填写工具</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <h1>简历填写工具</h1>
    <p class="subtitle">本地资料 · 页面填写 · 您再确认提交</p>
  </header>

  <section class="card" id="summary-card">
    <h2>当前资料摘要</h2>
    <dl class="summary" id="profile-summary">
      <div><dt>姓名</dt><dd id="s-name">—</dd></div>
      <div><dt>邮箱</dt><dd id="s-email">—</dd></div>
      <div><dt>电话</dt><dd id="s-phone">—</dd></div>
      <div><dt>城市</dt><dd id="s-city">—</dd></div>
      <div><dt>职位</dt><dd id="s-title">—</dd></div>
    </dl>
    <p class="hint" id="empty-hint" hidden>尚未填写资料，请先打开「编辑简历资料」。</p>
  </section>

  <section class="actions">
    <button type="button" class="btn primary" id="btn-fill">一键填写当前页面</button>
    <a class="btn secondary" id="link-options" href="#">编辑简历资料</a>
  </section>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <footer class="footer">
    <span>数据仅保存在本机浏览器</span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
