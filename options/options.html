<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>编辑简历资料 — 简历填写工具</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1>编辑简历资料</h1>
      <p class="subtitle">资料保存在本机 <code>chrome.storage.local</code>，不会上传到任何服务器。</p>
    </header>

    <div class="toolbar">
      <button type="button" class="btn ghost" id="btn-import">导入 JSON</button>
      <button type="button" class="btn ghost" id="btn-export">导出 JSON</button>
      <button type="button" class="btn ghost" id="btn-sample">加载示例资料</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden />
    </div>

    <form id="profile-form" autocomplete="off">
      <fieldset>
        <legend>基本</legend>
        <div class="grid">
          <label>姓名<input type="text" name="name" placeholder="例如：张三" /></label>
          <label>名（可选覆盖）<input type="text" name="firstName" placeholder="显式优先于从姓名拆分" /></label>
          <label>姓（可选覆盖）<input type="text" name="lastName" placeholder="显式优先于从姓名拆分" /></label>
          <label>邮箱<input type="email" name="email" placeholder="you@example.com" /></label>
          <label>电话<input type="tel" name="phone" placeholder="手机号" /></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>联系与链接</legend>
        <div class="grid">
          <label>城市<input type="text" name="city" placeholder="例如：上海" /></label>
          <label class="full">详细地址<input type="text" name="address" placeholder="街道门牌等" /></label>
          <label>省/州<input type="text" name="province" placeholder="例如：上海市" /></label>
          <label>邮编<input type="text" name="zip" placeholder="邮政编码" /></label>
          <label>国家<input type="text" name="country" placeholder="例如：中国" /></label>
          <label class="full">LinkedIn<input type="url" name="linkedin" placeholder="https://www.linkedin.com/in/…" /></label>
          <label class="full">GitHub<input type="url" name="github" placeholder="https://github.com/…" /></label>
          <label class="full">个人网站 / 作品集<input type="url" name="website" placeholder="https://…" /></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>教育</legend>
        <div class="grid">
          <label>学校<input type="text" name="school" placeholder="毕业院校" /></label>
          <label>学历<input type="text" name="degree" placeholder="本科 / 硕士 / 博士…" /></label>
          <label>专业<input type="text" name="major" placeholder="所学专业" /></label>
          <label>毕业年份<input type="text" name="gradYear" placeholder="例如：2020" /></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>工作</legend>
        <div class="grid">
          <label>公司<input type="text" name="company" placeholder="当前或最近公司" /></label>
          <label>职位<input type="text" name="title" placeholder="职位名称" /></label>
          <label>工作年限<input type="text" name="years" placeholder="例如：3" /></label>
          <label>开始日期（可选）<input type="text" name="startDate" placeholder="例如：2020-07" /></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>求职偏好</legend>
        <div class="grid">
          <label>期望薪资<input type="text" name="expectedSalary" placeholder="例如：25K-35K" /></label>
          <label>到岗时间<input type="text" name="availability" placeholder="例如：两周内到岗" /></label>
          <label class="full">工作许可 / 签证<input type="text" name="workAuth" placeholder="例如：中国大陆公民，可合法全职工作" /></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>其他</legend>
        <div class="grid">
          <label class="full">技能
            <textarea name="skills" rows="2" placeholder="用逗号或换行分隔，例如：JavaScript, Python, 沟通协作"></textarea>
          </label>
          <label class="full">自我介绍
            <textarea name="summary" rows="5" placeholder="简短自我评价或求职信草稿"></textarea>
          </label>
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="submit" class="btn primary">保存资料</button>
        <button type="button" class="btn ghost" id="btn-clear">清空</button>
        <span class="save-status" id="save-status" role="status" aria-live="polite"></span>
      </div>
    </form>
  </div>
  <script src="../shared/profile.js"></script>
  <script src="options.js"></script>
</body>
</html>
